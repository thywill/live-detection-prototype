<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live detection tool</title>
  <link rel="stylesheet" href="style/main.css">
</head>
<body>
  <header class="top-nav">
    <h1 class="top-nav__title">Live detection tool</h1>
    <nav class="top-nav__actions" aria-label="Live detection controls">
      <button type="button" id="btn-live-toggle" class="btn btn--primary" aria-pressed="false">Start Live Detection</button>
      <button type="button" id="btn-record" class="btn btn--secondary" aria-pressed="false">Start Recording</button>
      <button type="button" id="btn-export-csv" class="btn btn--secondary">Export CSV</button>
      <button type="button" id="btn-export-json" class="btn btn--secondary">Export JSON</button>
    </nav>
  </header>

  <div class="app-layout">
    <aside id="sidebar" class="sidebar" aria-label="Live detection status">
      <section class="sidebar__section">
        <h2 class="sidebar__heading">Backend</h2>
        <p class="live-stat" data-metric="backend">—</p>
      </section>
      <section class="sidebar__section">
        <h2 class="sidebar__heading">Performance</h2>
        <dl class="live-stat-list">
          <div class="live-stat-row"><dt>Inference</dt><dd data-metric="instant">—</dd></div>
          <div class="live-stat-row"><dt>Avg (30)</dt><dd data-metric="avg">—</dd></div>
          <div class="live-stat-row"><dt>Effective FPS</dt><dd data-metric="fps">—</dd></div>
          <div class="live-stat-row"><dt>Frames</dt><dd data-metric="frames">0</dd></div>
        </dl>
      </section>
      <section class="sidebar__section">
        <h2 class="sidebar__heading">GPS</h2>
        <p class="live-stat live-stat--gps" data-metric="gps">—</p>
      </section>
      <section class="sidebar__section">
        <h2 class="sidebar__heading">Log</h2>
        <dl class="live-stat-list">
          <div class="live-stat-row"><dt>Logged</dt><dd data-metric="logged">0</dd></div>
        </dl>
      </section>
    </aside>

    <main id="main-content" class="main-content">
      <div id="live-stage" class="live-stage">
        <div id="live-feed" class="live-stage__feed" hidden>
          <div class="live-stage__media">
            <video id="live-video" class="live-stage__video" autoplay playsinline muted></video>
          </div>
        </div>
        <div id="live-idle" class="live-stage__idle">
          <p class="live-stage__idle-title">Start live detection</p>
          <p class="live-stage__idle-copy">Camera feed and object boxes will appear here.</p>
          <button type="button" id="btn-live-start-main" class="btn btn--primary">Start live detection</button>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
