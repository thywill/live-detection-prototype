<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live detection tool</title>
  <link rel="stylesheet" href="style/main.css">
</head>
<body>
  <header class="top-nav">
    <h1 class="top-nav__title">Live detection tool</h1>
    <nav class="top-nav__actions" aria-label="Live detection controls">
      <button type="button" id="btn-live-toggle" class="btn btn--primary" aria-pressed="false">Start Live Detection</button>
      <button type="button" id="btn-record" class="btn btn--secondary" aria-pressed="false">Start Recording</button>
      <button type="button" id="btn-export-csv" class="btn btn--secondary">Export CSV</button>
      <button type="button" id="btn-export-json" class="btn btn--secondary">Export JSON</button>
    </nav>
  </header>

  <div class="app-layout">
    <aside id="sidebar" class="sidebar" aria-label="Live detection status">
      <div class="live-sidebar-stack">
        <section class="live-card">
          <h2 class="live-card__label">Model</h2>
          <select id="model-picker" class="model-picker" aria-label="Model"></select>
        </section>

        <section class="live-card">
          <h2 class="live-card__label">Backend</h2>
          <p class="live-card__backend" data-metric="backend">—</p>
        </section>

        <section class="live-card">
          <h2 class="live-card__label">Performance</h2>
          <dl class="live-card__rows">
            <div class="live-card__row">
              <dt>Inference</dt>
              <dd data-metric="instant">—</dd>
            </div>
            <div class="live-card__row">
              <dt>Avg (30)</dt>
              <dd data-metric="avg">—</dd>
            </div>
            <div class="live-card__row">
              <dt>Effective FPS</dt>
              <dd data-metric="fps">—</dd>
            </div>
            <div class="live-card__row">
              <dt>Frames</dt>
              <dd data-metric="frames">0</dd>
            </div>
          </dl>
        </section>

        <section class="live-card">
          <h2 class="live-card__label">GPS</h2>
          <p class="live-card__gps" data-metric="gps">—</p>
        </section>

        <section class="live-card live-card--logged">
          <h2 class="live-card__label">Logged</h2>
          <p class="live-card__logged-value" data-metric="logged">0</p>
        </section>
      </div>
    </aside>

    <main id="main-content" class="main-content">
      <div id="live-stage" class="live-stage">
        <div id="live-feed" class="live-stage__feed" hidden>
          <div class="live-stage__media">
            <video id="live-video" class="live-stage__video" autoplay playsinline muted></video>
            <ol id="class-readout" class="class-readout" hidden></ol>
          </div>
        </div>
        <div id="live-idle" class="live-stage__idle">
          <p class="live-stage__idle-title">Start live detection</p>
          <p class="live-stage__idle-copy">Camera feed and object boxes will appear here.</p>
          <button type="button" id="btn-live-start-main" class="btn btn--primary">Start live detection</button>
        </div>
        <div id="model-loading" class="live-stage__loading" hidden>
          <p class="live-stage__loading-label">Loading…</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
